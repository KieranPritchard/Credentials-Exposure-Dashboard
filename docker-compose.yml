x-laravel: &laravel
  build:
    context: .
    dockerfile: api/Dockerfile
    target: production
  env_file: .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: pgsql
    SESSION_DRIVER: file
    CACHE_STORE: file
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: credentials_dashboard
    DB_USERNAME: user
    DB_PASSWORD_FILE: /run/secrets/db-password
  secrets:
    - db-password
  depends_on:
    db:
      condition: service_healthy

services:
  # ==========================================
  # 1. Laravel Backend Service (API)
  # ==========================================
  app:
    <<: *laravel
    container_name: app_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  # ==========================================
  # 2. Laravel Scheduler Service
  # ==========================================
  scheduler:
    <<: *laravel
    container_name: app_scheduler
    command: php artisan schedule:work
    restart: always

  # ==========================================
  # 3. PostgreSQL Database Service
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      POSTGRES_DB: credentials_dashboard
    secrets:
      - db-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user -d credentials_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 4. Isolated Test Runner Service
  # ==========================================
  test:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: test
    profiles:
      - test
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: credentials_dashboard_test
      DB_USERNAME: user
      DB_PASSWORD_FILE: /run/secrets/db-password
    secrets:
      - db-password
    depends_on:
      db:
        condition: service_healthy
    command: php artisan test

  # ==========================================
  # 5. React Frontend Service
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: app_frontend
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  db-data:

secrets:
  db-password:
    file: ./secrets/db/password.txt
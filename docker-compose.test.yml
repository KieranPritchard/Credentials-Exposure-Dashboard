services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laravel_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laravel_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_KEY: base64:sM+syEEtgHbhgEKIf/w7uXmuBo8ysD8by6OwnWFGQOA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: laravel_test
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    command: php artisan test